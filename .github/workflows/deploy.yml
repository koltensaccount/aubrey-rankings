name: CI/CD - Build and Publish

on:
  push:
    branches:
      - main

concurrency:
  group: aubrey-production-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koltenbendickson
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aubrey_rankings
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Schema Migrations
        env:
          DATABASE_URL: postgresql://koltenbendickson:password@localhost:5432/aubrey_rankings
          MIGRATIONS_DIR: ./src/db/migrations
        run: node scripts/migrate.cjs
        # Use the exact SQL shipped in the production image.
        # The runner defaults to /app/migrations in Docker.
        # Source checkouts use MIGRATIONS_DIR.

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://koltenbendickson:password@localhost:5432/aubrey_rankings
          BETTER_AUTH_SECRET: 9c58715c7f3f67ff199150b1a4b2a3b25804c43657b0fd945f997ce752797c2e
          BETTER_AUTH_URL: http://localhost:3000
        run: npm test

  build-and-publish:
    name: Build & Publish Container Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/koltensaccount/aubrey-rankings
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
